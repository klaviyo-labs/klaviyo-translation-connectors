[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klaviyo-translation-connectors"
version = "0.1.0"
description = "Reference connectors between Klaviyo Translations (beta API) and translation management systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
klaviyo-tc = "klaviyo_tc.cli:cli"

[project.urls]
Homepage = "https://github.com/klaviyolabs/klaviyo-translation-connectors"

[tool.hatch.build.targets.wheel]
packages = ["src/klaviyo_tc"]

[tool.pytest.ini_options]
addopts = "--cov=klaviyo_tc --cov-report=term-missing"
testpaths = ["tests"]
